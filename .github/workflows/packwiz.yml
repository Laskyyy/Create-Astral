name: "Build with packwiz"
run-name: "Packwiz Build #${{ github.run_number }}"

on:
  workflow_dispatch:
    paths:
      - "config"
      - "configureddefaults"
      - "defaultconfigs"
      - "fancymenustuff"
      - "journeymap"
      - "kubejs"
      - "mods"
      - "resourcepacks"
      - "schematics"
      - "serverpack"
      - "shaderpacks"
      - ".packwizignore"
      - "CHANGELOG.md"
      - "icon.png"
      - "index.toml"
      - "pack.toml"
      - "server.packwizignore"
  push:
    branches:
      - Astral-Experimental
      - main
    paths:
      - "config"
      - "configureddefaults"
      - "defaultconfigs"
      - "fancymenustuff"
      - "journeymap"
      - "kubejs"
      - "mods"
      - "resourcepacks"
      - "schematics"
      - "serverpack"
      - "shaderpacks"
      - ".packwizignore"
      - "CHANGELOG.md"
      - "icon.png"
      - "index.toml"
      - "pack.toml"
      - "server.packwizignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Modpack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"

      - name: Download packwiz binary # now with static releases instead of action artifacts!
        id: download-packwiz
        uses: robinraju/release-downloader@v1.13
        with:
          repository: The-Shortman/packwiz
          tag: "v1.0.0"
          fileName: Linux_x86-64.zip
          extract: true

      - name: Make packwiz binary executable
        shell: bash
        run: chmod +x ./packwiz

      - name: Restore cached mod downloads
        id: cache-mods-restore
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.cache/packwiz/cache
          key: cached-mods
          restore-keys: |
            cached-mods-

      - name: Construct version strings
        id: construct-base-name
        shell: bash
        run: |
          GIT_HASH="$(git rev-parse --short ${{github.sha}})"
          echo "MODPACK_VERSION_NUMBER=$GIT_HASH-Build.${{github.run_number}}" >> "$GITHUB_OUTPUT"
          echo "ASTRAL_CF_NAME=Create-Astral-CurseForge-$MODPACK_VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ASTRAL_SERVER_NAME=Create-Astral-Server-$MODPACK_VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          FABRIC_VERSION_NUMBER="$(echo "$(<pack.toml)" | grep "fabric =" | cut -d '"' -f 2)"
          echo "FABRIC_VERSION=$FABRIC_VERSION_NUMBER" >> "$GITHUB_OUTPUT"

      # cant use sed easily here because it gets weird when the version grabber greps for regex characters like [] expecially in experimental versioning
      # note that in theory this workaround technically isn't needed due to the change in versioning strategy, but it still works :shrug:
      - name: Set pack.toml version
        id: packwiz-version
        shell: bash
        run: |
          VERSION="${{steps.construct-base-name.outputs.MODPACK_VERSION_NUMBER}}"
          while read -r line; do
            echo "${line//"DEV"/"$VERSION"}"
          done < "pack.toml" > "pack.toml.tmp"
          cat pack.toml.tmp > pack.toml
          rm pack.toml.tmp

      # need to set IFS to be empty so that read preserves whitespace
      - name: Set FancyMenu environment variable
        id: fancymenu-version
        shell: bash
        run: |
          VERSION="${{steps.construct-base-name.outputs.MODPACK_VERSION_NUMBER}}"
          OLD_IFS="$IFS"
          IFS=
          while read -r line; do
            echo "${line//"DEV"/"$VERSION"}"
          done < "./config/fancymenu/user_variables.db" > "./config/fancymenu/user_variables.db.tmp"
          IFS="$OLD_IFS"
          cat ./config/fancymenu/user_variables.db.tmp > ./config/fancymenu/user_variables.db
          rm ./config/fancymenu/user_variables.db.tmp

      - name: Set startup debug log version
        id: startup-version
        shell: bash
        run: |
          VERSION="${{steps.construct-base-name.outputs.MODPACK_VERSION_NUMBER}}"
          OLD_IFS="$IFS"
          IFS=
          while read -r line; do
            echo "${line//"DEV"/"$VERSION"}"
          done < "./kubejs/startup_scripts/misc/misc.js" > "./kubejs/startup_scripts/misc/misc.js.tmp"
          IFS="$OLD_IFS"
          cat ./kubejs/startup_scripts/misc/misc.js.tmp > ./kubejs/startup_scripts/misc/misc.js
          rm ./kubejs/startup_scripts/misc/misc.js.tmp

      # servercore needs to be turned into a .toml for the curseforge export as CF won't accept it as an override jar
      - name: Prepare for CurseForge client zip creation
        shell: bash
        run: |
          mkdir temp-jar
          mv mods/servercore* ./temp-jar
          ./packwiz cf add https://www.curseforge.com/minecraft/mc-mods/servercore/files/4492100

      - name: Create CurseForge client zip
        shell: bash
        run: |
          ./packwiz curseforge export -o "${{steps.construct-base-name.outputs.ASTRAL_CF_NAME}}.zip"
          ./packwiz refresh

      - name: Clean up after CurseForge client zip creation
        shell: bash
        run: |
          ./packwiz remove servercore
          mv temp-jar/servercore* ./mods
          rm -r ./temp-jar

      - name: Prepare for serverpack creation
        run: |
          cat server.packwizignore >> .packwizignore
          mv serverpack/* ./
          ./packwiz refresh
          mkdir server

      - name: Download packwiz-installer-bootstrap
        uses: robinraju/release-downloader@v1.13
        with:
          repository: packwiz/packwiz-installer-bootstrap
          latest: true
          fileName: packwiz-installer-bootstrap.jar

      - name: Create serverpack
        run: |
          cd server
          java -jar ../packwiz-installer-bootstrap.jar -g -s server ../pack.toml
          curl "https://meta.fabricmc.net/v2/versions/loader/1.18.2/${{steps.construct-base-name.outputs.FABRIC_VERSION}}/0.11.1/server/jar" --output server.jar
          rm -f packwiz-installer.jar
          rm -f packwiz.json
          ls -l
          cd ../

      - name: Cache mod downloads
        id: cache-mods-save
        uses: actions/cache/save@v6
        with:
          path: |
            /home/runner/.cache/packwiz/cache
            ./server/mods
          key: cached-mods-${{ hashFiles('/home/runner/.cache/packwiz/cache/**/*') }}-${{ hashFiles('./server/mods') }}

      # Otherwise the artifact would be a zip in a zip, which can't be automatically installed in launchers
      - name: Unpack client pack for nicer artifact
        run: |
          unzip "${{steps.construct-base-name.outputs.ASTRAL_CF_NAME}}.zip" -d ./client

      - name: Upload client pack to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.construct-base-name.outputs.ASTRAL_CF_NAME}}
          path: ./client

      - name: Upload serverpack to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.construct-base-name.outputs.ASTRAL_SERVER_NAME}}
          path: ./server
